name: Сборка НОМЕРОК 3D (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "fonts/**"
      - "generate_keychain.py"
      - "nomerok3d.spec"
      - "requirements-app.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pyinstaller==6.11.1

      - name: Проверка исходников до сборки
        run: python -m app.main --selftest

      - name: Сборка exe
        run: pyinstaller --noconfirm --clean nomerok3d.spec

      # Самопроверка по стадиям: если что-то сломается, по названию упавшего
      # шага сразу видно, где именно — даже не открывая логи.
      - name: Проверка exe 1 — модули и данные внутри бандла
        shell: pwsh
        timeout-minutes: 4
        run: ./.github/run-stage.ps1 -Stage 1

      - name: Проверка exe 2 — геометрия и превью
        shell: pwsh
        timeout-minutes: 4
        run: ./.github/run-stage.ps1 -Stage 2

      - name: Проверка exe 3 — запись 3MF и STL
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/run-stage.ps1 -Stage 3

      - name: Проверка exe 4 — окно приложения (pywebview)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: ./.github/run-stage.ps1 -Stage 4

      - uses: actions/upload-artifact@v4
        with:
          name: NOMEROK-3D-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Выложить в релиз app-latest
        if: github.ref_name != 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          gh release delete app-latest --yes --cleanup-tag 2>$null
          gh release create app-latest "$exe" `
            --target $env:GITHUB_SHA `
            --title "НОМЕРОК 3D — последняя сборка" `
            --notes "Конструктор брелоков-автономеров для Bambu Lab A1 без AMS.

          Скачай NOMEROK-3D.exe и запусти — установка не нужна. Внутри: набор номера
          колёсиками, крепление (ушко под карабин или отверстие в пластине) с
          ограничением размера по прочности, надпись-гравировка на обороте,
          живое превью и генерация 3MF/STL прямо в выбранную папку.

          Windows 10/11 x64. При первом запуске SmartScreen может спросить
          подтверждение: «Подробнее» → «Выполнить в любом случае» (файл без
          цифровой подписи — это нормально)."
