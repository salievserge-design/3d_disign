name: Сборка НОМЕРОК 3D (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "fonts/**"
      - "generate_keychain.py"
      - "nomerok3d.spec"
      - "requirements-app.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pyinstaller==6.11.1

      - name: Проверка исходников до сборки
        run: python -m app.main --selftest

      - name: Сборка проверочного exe (с консолью)
        env:
          NOMEROK_CONSOLE: "1"
        run: pyinstaller --noconfirm --clean nomerok3d.spec

      # Самопроверка по стадиям: если что-то сломается, по названию упавшего
      # шага сразу видно, где именно — даже не открывая логи.
      - name: Проверка exe 1 — модули и данные внутри бандла
        shell: pwsh
        timeout-minutes: 4
        run: ./.github/run-stage.ps1 -Stage 1

      - name: Проверка exe 2 — геометрия и превью
        shell: pwsh
        timeout-minutes: 4
        run: ./.github/run-stage.ps1 -Stage 2

      - name: Проверка exe 3 — запись 3MF и STL
        shell: pwsh
        timeout-minutes: 5
        run: ./.github/run-stage.ps1 -Stage 3

      - name: Проверка exe 4 — окно приложения (pywebview)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: ./.github/run-stage.ps1 -Stage 4

      - name: Сборка основного exe (оконного)
        run: pyinstaller --noconfirm nomerok3d.spec

      - name: Диагностика при неудаче
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $diag = Join-Path $env:RUNNER_TEMP "diag.txt"
          if (-not (Test-Path $diag)) { "нечего сообщать"; exit 0 }
          $body = Get-Content $diag -Raw
          Add-Content $env:GITHUB_STEP_SUMMARY "``````$body``````"
          $json = @{ body = "Диагностика сборки exe:" + [char]10 + '```' + [char]10 + $body + [char]10 + '```' } | ConvertTo-Json -Compress
          $json | gh api "repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/comments" --input - > $null
          "диагностика отправлена комментарием к коммиту"

      - uses: actions/upload-artifact@v4
        with:
          name: NOMEROK-3D-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Выложить в релиз app-latest
        if: github.ref_name != 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $main = (Get-ChildItem dist -Filter "NOMEROK-3D.exe").FullName
          $cons = (Get-ChildItem dist -Filter "NOMEROK-3D-console.exe").FullName
          gh release delete app-latest --yes --cleanup-tag 2>$null
          gh release create app-latest "$main" "$cons" `
            --target $env:GITHUB_SHA `
            --title "НОМЕРОК 3D — последняя сборка" `
            --notes "Конструктор брелоков-автономеров для Bambu Lab A1 без AMS.

          Скачай NOMEROK-3D.exe и запусти — установка не нужна. Внутри: набор номера
          колёсиками, крепление (ушко под карабин или отверстие в пластине) с
          ограничением размера по прочности, надпись-гравировка на обороте,
          живое превью и генерация 3MF/STL прямо в выбранную папку.

          Windows 10/11 x64. При первом запуске SmartScreen может спросить
          подтверждение: «Подробнее» → «Выполнить в любом случае» (файл без
          цифровой подписи — это нормально).

          NOMEROK-3D-console.exe — тот же конструктор, но с чёрным окном, где
          видно, что происходит. Нужен, только если основной файл не открылся:
          запусти его и пришли текст из окна."
