name: Сборка НОМЕРОК 3D (Windows exe)

on:
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "fonts/**"
      - "generate_keychain.py"
      - "nomerok3d.spec"
      - "requirements-app.txt"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pyinstaller==6.11.1

      - name: Сборка exe
        run: pyinstaller --noconfirm --clean nomerok3d.spec

      - name: Самопроверка собранного exe
        shell: pwsh
        timeout-minutes: 6
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "exe не собрался" }
          "Собрано: $($exe.Name), $([math]::Round($exe.Length/1MB,1)) МБ"
          # прогоняем всю цепочку внутри собранного exe: геометрия, превью, запись файлов
          $log = Join-Path $env:TEMP "nomerok3d.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(240000)) {
            $p.Kill(); Start-Sleep 2
            if (Test-Path $log) { Get-Content $log }
            throw "exe завис на самопроверке — окно не открылось, но и не завершился"
          }
          if (Test-Path $log) { Get-Content $log } else { "лог не появился — exe умер на старте" }
          if ($p.ExitCode -ne 0) { throw "самопроверка не прошла (код $($p.ExitCode))" }

      - uses: actions/upload-artifact@v4
        with:
          name: NOMEROK-3D-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Выложить в релиз app-latest
        if: github.ref_name != 'main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app-latest --yes --cleanup-tag 2>$null
          $exe = (Get-ChildItem dist -Filter *.exe | Select-Object -First 1).FullName
          gh release create app-latest "$exe" `
            --target $env:GITHUB_SHA `
            --title "НОМЕРОК 3D — последняя сборка" `
            --notes "Конструктор брелоков-автономеров для Bambu Lab A1 без AMS.

          Скачай .exe, запусти — установка не нужна. Внутри: выбор номера колёсиками,
          крепление (ушко под карабин или отверстие в пластине) с ограничением размера,
          надпись-гравировка на обороте и генерация 3MF/STL прямо в выбранную папку.

          Windows 10/11 x64. При первом запуске SmartScreen может спросить подтверждение:
          «Подробнее» → «Выполнить в любом случае» (файл без подписи, это нормально)."
